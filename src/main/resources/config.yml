# Настройки кланов
clans:
  # Максимальное количество участников в клане
  max-members: 10

  # Токены за принятие нового игрока
  tokens-for-join: 5

  # Время телепортации на точку дома (в секундах, 0 = мгновенно)
  home-teleport-delay: 0

# Настройки квестов
quests:
  # Время обновления квестов в минутах (проверка)
  check-interval: 1

# Настройки интерфейса
gui:
  # Название главного меню
  main-menu-title: "§6Меню клана"